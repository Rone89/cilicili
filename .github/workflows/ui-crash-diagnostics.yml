name: Export previous UI crash diagnostics
on:
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  export:
    if: ${{ github.head_ref == 'codex/ui-crash-diagnostics' }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 Scripts/ci-environment.py select-xcode
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-test-results-ui-2
          run-id: 39093225488
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/source.xcresult
      - name: Export readable results and crash reports
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/exported"
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/source.xcresult" > "$RUNNER_TEMP/exported/summary.json"
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/source.xcresult" > "$RUNNER_TEMP/exported/tests.json"
          xcrun xcresulttool export diagnostics --path "$RUNNER_TEMP/source.xcresult" --output-path "$RUNNER_TEMP/exported/diagnostics"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/source.xcresult" --output-path "$RUNNER_TEMP/exported/attachments"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: readable-ui-crash-diagnostics
          path: ${{ runner.temp }}/exported
          if-no-files-found: error
