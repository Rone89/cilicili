name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select installed Xcode 26
        run: python3 Scripts/ci-environment.py select-xcode

      - name: Build Release app without signing
        run: zsh Scripts/build-release-unsigned-ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cilicili-release-unsigned-ipa
          path: build/release-unsigned-ipa/bili-release-unsigned.ipa
          if-no-files-found: error

      - name: Upload Release build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-release-log
          path: build/logs/release-unsigned-ipa.log
          if-no-files-found: warn
