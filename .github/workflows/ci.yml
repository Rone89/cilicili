name: Build 24 package validation

on:
  pull_request:

permissions:
  contents: read

env:
  PROJECT: bili.xcodeproj
  SCHEME: bili

jobs:
  release:
    name: Xcode 26 Build 24 package
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout exact application source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4a0ce7e7d3d911afb8df58285b93435a1b09dcc6
      - name: Verify application source
        run: |
          test "$(git rev-parse HEAD)" = "4a0ce7e7d3d911afb8df58285b93435a1b09dcc6"
          test "$(git rev-parse HEAD^{tree})" = "c348f5521646476d8b07a9b32c6e84f71f9e8543"
      - name: Select installed Xcode 26
        run: python3 Scripts/ci-environment.py select-xcode
      - name: Build Release without signing
        id: release
        run: |
          zsh Scripts/build-release-unsigned-ipa.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          path = Path("build/release-unsigned-ipa/build-info.json")
          info = json.loads(path.read_text())
          info["workflow_commit"] = info["commit"]
          info["commit"] = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          info["source_tree"] = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          assert info["commit"] == "4a0ce7e7d3d911afb8df58285b93435a1b09dcc6"
          assert info["source_tree"] == "c348f5521646476d8b07a9b32c6e84f71f9e8543"
          path.write_text(json.dumps(info, indent=2) + "\n")
          PY
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cilicili-${{ steps.release.outputs.version }}-build-${{ steps.release.outputs.build }}-unsigned-ipa
          path: |
            build/release-unsigned-ipa/bili-release-unsigned.ipa
            build/release-unsigned-ipa/build-info.json
            build/release-unsigned-ipa/bili-release-unsigned.ipa.sha256
          if-no-files-found: error
      - name: Upload build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build24-package-log
          path: build/logs/release-unsigned-ipa.log
          if-no-files-found: ignore
