name: iOS CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replies-probe:
    uses: ./.github/workflows/xcode-test-suite.yml
    with:
      suite: replies-probe
      test_target: biliUITests/DynamicRepliesPaginationUITests
